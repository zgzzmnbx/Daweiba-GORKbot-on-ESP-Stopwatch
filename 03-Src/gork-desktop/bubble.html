<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>Gork 聊天气泡</title><link rel="stylesheet" href="bubble.css"></head>
<body data-side="above">
  <section class="speech-card" aria-label="Gork 聊天气泡">

    <footer><span id="bubble-hint">桌面消息</span><button id="open-console">打开控制台 ↗</button></footer>
  </section>
  <script src="bubble.js"></script>
