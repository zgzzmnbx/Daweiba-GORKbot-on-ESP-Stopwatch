<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <link rel="stylesheet" href="avatar.css">
  <title>Gork</title>
</head>
<body>
  <main id="avatar" class="avatar idle" aria-label="Gork 桌面小人">
    <div class="drag-zone" aria-hidden="true"></div>
    <div class="face-wrap"><div id="quota-ring-outer" class="quota-ring quota-outer" aria-hidden="true"></div><div id="quota-ring-inner" class="quota-ring quota-inner" aria-hidden="true"></div><canvas id="gork-face" class="face" aria-label="Grok bot 黑色圆体白色双眼"></canvas></div>
    <p id="status">就绪</p>
    <button id="quota-detail" class="quota-detail" type="button" title="Codex 额度未知" aria-label="Codex 额度未知" hidden>额度</button>
    <div id="quota-tooltip" class="quota-tooltip" role="status" hidden></div>
    <div class="actions">
      <button id="console">控制台</button><button id="hide">隐藏</button>
    </div>
  </main>
  <script src="gork-catalog.js"></script>
  <script src="avatar-engine.js"></script><script src="avatar-presets.js"></script><script src="gork-appearance.js"></script><script src="gork-avatar.js"></script>
  <script src="avatar.js"></script>
</body>
</html>
